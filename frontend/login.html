<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CitiFix | Login</title>

    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-left">

            <h1>Welcome Back 👋</h1>

            <p>
                Continue building cleaner, safer
                and smarter communities with CitiFix.
            </p>

        </div>

        <div class="auth-right">

            <div class="auth-card">

                <h2>Login</h2>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter Email"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                >

                <button onclick="loginUser()">
                    Login
                </button>

                <p class="bottom-text">
                    Don't have an account?

                    <a href="register.html">
                        Register
                    </a>
                </p>

            </div>

        </div>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
